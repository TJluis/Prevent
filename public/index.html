<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Club Pingüi</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="join-screen">
    <h1>Club Pingüi</h1>
    <p class="hint">Elígete un nombre para entrar al espacio 3D.</p>
    <form id="join-form">
      <input id="name-input" type="text" maxlength="20" placeholder="Tu nombre…" autocomplete="off" />
      <button id="join-btn" type="submit">Entrar</button>
    </form>
    <p id="join-error"></p>
  </div>

  <div id="game" hidden>
    <div id="game-error" hidden></div>
    <div id="instructions">Muévete con WASD o las flechas</div>

    <div id="online-panel">
      <div id="online-title">En línea <button id="logout-btn" type="button">Cerrar sesión</button></div>
      <ul id="online-list"></ul>
    </div>

    <div id="chat">
      <div id="chat-log"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" maxlength="200" placeholder="Escribe un mensaje…" autocomplete="off" />
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
