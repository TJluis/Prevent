<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Tuner de aletas — 1ª persona</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0b1016; color: #dbe6f2;
    font: 13px/1.45 system-ui, sans-serif;
  }
  #stage { position: fixed; inset: 0 360px 0 0; }
  #stage canvas { display: block; }
  #cross {
    position: fixed; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    pointer-events: none; z-index: 5;
  }
  #cross::before, #cross::after {
    content: ""; position: absolute; background: rgba(255,255,255,.75);
  }
  #cross::before { left: 50%; top: 0; width: 1px; height: 100%; margin-left: -.5px; }
  #cross::after  { top: 50%; left: 0; height: 1px; width: 100%; margin-top: -.5px; }
  #safe {
    position: fixed; border: 1px dashed rgba(120,200,255,.35); border-radius: 50%;
    pointer-events: none; z-index: 4; transform: translate(-50%, -50%);
  }
  #panel {
    position: fixed; top: 0; right: 0; width: 360px; height: 100%;
    overflow-y: auto; padding: 10px 12px 40px; background: #111823;
    border-left: 1px solid #22304a;
  }
  h1 { font-size: 14px; margin: 4px 0 8px; letter-spacing: .3px; }
  h2 { font-size: 12px; margin: 14px 0 6px; color: #8fb6e8; text-transform: uppercase; letter-spacing: .6px; }
  label { display: block; margin: 6px 0 2px; color: #9fb4cc; }
  select, input[type=number], input[type=color], button, textarea {
    background: #0e1622; color: #dbe6f2; border: 1px solid #2a3b56; border-radius: 4px;
    font: inherit; padding: 3px 6px; width: 100%;
  }
  button { cursor: pointer; margin: 4px 4px 0 0; width: auto; padding: 5px 9px; }
  button:hover { background: #1b2940; }
  .row { display: grid; grid-template-columns: 62px 1fr 58px; gap: 6px; align-items: center; margin: 3px 0; }
  .row span { color: #9fb4cc; font-size: 12px; }
  .row input[type=number] { padding: 2px 4px; }
  input[type=range] { width: 100%; }
  textarea { height: 150px; font: 11px/1.35 ui-monospace, Consolas, monospace; white-space: pre; }
  .diag { font: 11px/1.5 ui-monospace, Consolas, monospace; background: #0c131d; border: 1px solid #1e2c42;
          border-radius: 4px; padding: 6px 8px; white-space: pre-wrap; }
  .warn { color: #ffb454; }
  .ok { color: #7ee081; }
  .hint { color: #7d93ad; font-size: 11px; margin: 4px 0 0; }
  #status { font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="safe"></div>
<div id="cross"></div>

<div id="panel">
  <h1>Tuner de aletas (primera persona)</h1>
  <p class="hint">
    Mueve los sliders hasta que las DOS aletas sujeten el arma y no tapen la mira.
    Al final pulsa <b>Exportar HAND_TUNING</b> y pégame el texto (o <b>Enviar</b> si
    tengo el lector levantado).
  </p>

  <label>Arma</label>
  <select id="weapon"></select>

  <label>Color del cuerpo (para que las aletas combinen)</label>
  <input type="color" id="bodyColor" value="#222b3f" />

  <div id="sliders"></div>

  <h2>Diagnóstico</h2>
  <div class="diag" id="diag">—</div>

  <h2>Acciones</h2>
  <button id="btnReset">Reiniciar este arma</button>
  <button id="btnPresetLow">Probar: aletas desde abajo</button>
  <button id="btnCopy">Copiar</button>
  <button id="btnSend">Enviar</button>
  <button id="btnClear">Borrar todos los cambios</button>
  <div id="status" class="hint"></div>

  <h2>Valores para pegar en viewmodel.js</h2>
  <textarea id="out" spellcheck="false" readonly></textarea>
</div>

<script type="module">
import * as THREE from "/vendor/three/three.module.js";
import { buildViewmodel, getGripPose } from "/js/viewmodel.js";
import { WEAPON_LIST } from "/js/weaponDefs.js";

const STORE_KEY = "flippertune.v1";
const AXES = ["x", "y", "z"];
const POS_LIMITS = { min: -1.1, max: 1.1, step: 0.005 };
const ROT_LIMITS = { min: -3.2, max: 3.2, step: 0.01 };
const SAFE_R = 0.2;          // radio de la "zona segura" de la mira (fracción de altura)
const REPORT_URL = "http://127.0.0.1:3099/__tuner";

const stage = document.getElementById("stage");
const slidersEl = document.getElementById("sliders");
const diagEl = document.getElementById("diag");
const outEl = document.getElementById("out");
const statusEl = document.getElementById("status");
const weaponSel = document.getElementById("weapon");
const bodyColor = document.getElementById("bodyColor");

// ---------------------------------------------------------------- escena
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // igual que el juego
renderer.setSize(stage.clientWidth, stage.clientHeight);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1016);
// Mismas luces que createWorld con el tema por defecto (nevado).
scene.add(new THREE.AmbientLight(0xcfe8ff, 0.55));
scene.add(new THREE.HemisphereLight(0xdff3ff, 0x7fa0c0, 0.8));
const sun = new THREE.DirectionalLight(0xfff4df, 1.5);
sun.position.set(18, 30, 14);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(72, stage.clientWidth / stage.clientHeight, 0.01, 100);
camera.position.set(0, 0, 0);
scene.add(camera);          // el viewmodel cuelga de la cámara, como en main.js

// ---------------------------------------------------------------- estado
const store = load();
let rig = null;
let currentId = weaponSel.value;
const controls = new Map();   // "rightRot.y" -> { input, number }

function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch { return {}; }
}
function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}
function poseFor(id) {
  if (!store[id]) {
    const g = getGripPose(id);
    store[id] = {
      rightPos: g.rightPos, rightRot: g.rightRot,
      leftPos: g.leftPos, leftRot: g.leftRot,
    };
  }
  return store[id];
}

for (const w of WEAPON_LIST) {
  const o = document.createElement("option");
  o.value = w.id;
  o.textContent = `${w.name} (${w.id})`;
  weaponSel.appendChild(o);
}
currentId = weaponSel.value;

// ---------------------------------------------------------------- viewmodel
function rebuild() {
  if (rig) {
    camera.remove(rig.group);
    rig.group.traverse((c) => {
      if (c.isMesh) {
        c.geometry.dispose();
        if (Array.isArray(c.material)) c.material.forEach((m) => m.dispose());
        else if (c.material) c.material.dispose();
      }
    });
  }
  rig = buildViewmodel(currentId, { body: bodyColor.value });
  camera.add(rig.group);
  applyPose();
  // Salta la animación de "coger el arma": el tuner muestra la pose final.
  rig.update(performance.now() + 5000, 0.016, false);
}

// Aplica la postura guardada al viewmodel real (mismo camino que su update()).
function applyPose() {
  if (!rig) return;
  const p = poseFor(currentId);
  const right = rig.group.userData.rightHand;
  const left = rig.group.userData.leftHand;
  if (right) {
    right.userData.gripPos = p.rightPos.slice();
    right.userData.gripRot = p.rightRot.slice();
  }
  if (left) {
    left.userData.gripPos = p.leftPos.slice();
    left.userData.gripRot = p.leftRot.slice();
  }
  syncInputs();
}

function setValue(path, v) {
  const p = poseFor(currentId);
  const [g, a] = path.split(".");
  p[g][AXES.indexOf(a)] = v;
  save();
  applyPose();
  renderOut();
  autoPost();
}

// ---------------------------------------------------------------- sliders
function buildSliders() {
  slidersEl.innerHTML = "";
  controls.clear();
  const groups = [
    { key: "rightPos", label: "Posición derecha", ...POS_LIMITS },
    { key: "rightRot", label: "Rotación derecha", ...ROT_LIMITS },
    { key: "leftPos", label: "Posición izquierda", ...POS_LIMITS },
    { key: "leftRot", label: "Rotación izquierda", ...ROT_LIMITS },
  ];
  const names = ["X", "Y", "Z"];
  for (const grp of groups) {
    const h = document.createElement("h2");
    h.textContent = grp.label;
    slidersEl.appendChild(h);
    for (let i = 0; i < 3; i++) {
      const path = `${grp.key}.${AXES[i]}`;
      const row = document.createElement("div");
      row.className = "row";
      const lab = document.createElement("span");
      lab.textContent = names[i];
      const range = document.createElement("input");
      range.type = "range";
      range.min = grp.min; range.max = grp.max; range.step = grp.step;
      const num = document.createElement("input");
      num.type = "number";
      num.min = grp.min; num.max = grp.max; num.step = grp.step;
      range.addEventListener("input", () => setValue(path, parseFloat(range.value)));
      num.addEventListener("change", () => setValue(path, parseFloat(num.value)));
      row.append(lab, range, num);
      slidersEl.appendChild(row);
      controls.set(path, { range, num });
    }
  }
}

function syncInputs() {
  const p = poseFor(currentId);
  for (const [path, c] of controls) {
    const [g, a] = path.split(".");
    const v = p[g][AXES.indexOf(a)];
    c.range.value = v;
    c.num.value = Number(v.toFixed(3));
  }
}

// ---------------------------------------------------------------- diagnóstico
const tmpV = new THREE.Vector3();
const vecA = new THREE.Vector3();
const vecB = new THREE.Vector3();
const WRIST = new THREE.Vector3(0, 0.3, 0);   // el puño: lo que sujeta el arma
const TIP = new THREE.Vector3(0, -0.09, 0);    // la punta de la aleta

function screenPct(obj, local) {
  obj.updateWorldMatrix(true, false);
  tmpV.copy(local).applyMatrix4(obj.matrixWorld).project(camera);
  return { x: tmpV.x * 50, y: -tmpV.y * 50 };   // % respecto al centro de pantalla
}

function diagnose() {
  const grips = rig && rig.group && rig.group.userData.grips;
  if (!grips || !rig.group.userData.rightHand) {
    diagEl.textContent = "—";
    return;
  }
  const lines = [];
  const hands = [
    { tag: "derecha", hand: rig.group.userData.rightHand, grip: grips.right },
    { tag: "izquierda", hand: rig.group.userData.leftHand, grip: grips.left },
  ];
  for (const { tag, hand, grip } of hands) {
    if (!hand) continue;
    const wrist = screenPct(hand, WRIST);
    const tip = screenPct(hand, TIP);
    vecA.copy(WRIST).applyMatrix4(hand.matrixWorld);
    vecB.fromArray(grip).applyMatrix4(rig.group.matrixWorld);
    const d = vecA.distanceTo(vecB);
    const near = Math.abs(wrist.x) < SAFE_R * 100 && Math.abs(wrist.y) < SAFE_R * 100;
    lines.push(
      `${tag.padEnd(10)} puño (${fmt(wrist.x)}%, ${fmt(wrist.y)}%)  punta (${fmt(tip.x)}%, ${fmt(tip.y)}%)  dist agarre ${d.toFixed(3)}` +
        (near ? "   <-- tapando la mira" : "")
    );
  }
  diagEl.innerHTML = lines.join("\n");
}
function fmt(v) { return (v >= 0 ? "+" : "") + v.toFixed(0); }

function updateCross() {
  const w = stage.clientWidth, h = stage.clientHeight;
  const cross = document.getElementById("cross");
  cross.style.left = w / 2 + "px";
  cross.style.top = h / 2 + "px";
  const safe = document.getElementById("safe");
  const d = Math.min(w, h) * SAFE_R * 2;
  safe.style.left = w / 2 + "px";
  safe.style.top = h / 2 + "px";
  safe.style.width = d + "px";
  safe.style.height = d + "px";
}

// ---------------------------------------------------------------- exportar
function tuningBlock() {
  const lines = ["const HAND_TUNING = {"];
  for (const w of WEAPON_LIST) {
    const p = poseFor(w.id);
    const arr = (v) => `[${v.map((n) => Number(n.toFixed(3))).join(", ")}]`;
    lines.push(`  ${w.id}: { rightPos: ${arr(p.rightPos)}, rightRot: ${arr(p.rightRot)}, leftPos: ${arr(p.leftPos)}, leftRot: ${arr(p.leftRot)} },`);
  }
  lines.push("};");
  return lines.join("\n");
}

function payload() {
  const out = { generated: new Date().toISOString(), errors: window.__tunerErrors || [], tuning: {} };
  for (const w of WEAPON_LIST) out.tuning[w.id] = poseFor(w.id);
  return out;
}

// Errores de página: en modo auto se publican con el estado para poder
// verificarla sin mirar la consola del navegador.
window.__tunerErrors = [];
window.addEventListener("error", (e) => {
  window.__tunerErrors.push(String(e.message || e.error));
  autoPost();
});

function renderOut() {
  outEl.value = tuningBlock();
}

document.getElementById("btnReset").addEventListener("click", () => {
  delete store[currentId];
  save();
  rebuild();
  renderOut();
});

document.getElementById("btnPresetLow").addEventListener("click", () => {
  // Aletas entrando desde abajo y cruzando hacia el arma.
  const p = poseFor(currentId);
  p.rightPos = [p.rightPos[0], p.rightPos[1] - 0.34, p.rightPos[2] - 0.16];
  p.leftPos = [p.leftPos[0], p.leftPos[1] - 0.34, p.leftPos[2] - 0.16];
  p.rightRot = [1.24, -0.12, 0.62];
  p.leftRot = [1.24, 0.12, -0.62];
  save();
  applyPose();
  renderOut();
});

document.getElementById("btnCopy").addEventListener("click", async () => {
  outEl.select();
  try { await navigator.clipboard.writeText(outEl.value); statusEl.textContent = "Copiado."; }
  catch { statusEl.textContent = "Selecciona y copia con Ctrl+C."; }
});

document.getElementById("btnSend").addEventListener("click", () => postPayload());

async function postPayload() {
  statusEl.textContent = "Enviando...";
  try {
    const res = await fetch(REPORT_URL + "?__tuner", {
      // Sin cabeceras custom: es una "simple request" y no dispara preflight CORS.
      method: "POST",
      body: JSON.stringify(payload()),
    });
    statusEl.textContent = res.ok ? "Enviado. Ya lo tengo." : "El lector respondió " + res.status;
    return res.ok;
  } catch (e) {
    statusEl.textContent = "No hay lector levantado (usa Copiar y pégame el texto).";
    return false;
  }
}

// ?auto=1 deja la páginapublicando sola: útil para que yo pueda leer el estado
// final sin que tengas que pulsar nada.
const AUTO = new URLSearchParams(location.search).has("auto");
let autoTimer = 0;
function autoPost() {
  if (!AUTO) return;
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => { postPayload(); }, 400);
}

document.getElementById("btnClear").addEventListener("click", () => {
  if (!confirm("¿Borrar TODOS los ajustes guardados y volver a los valores del juego?")) return;
  localStorage.removeItem(STORE_KEY);
  location.reload();
});

weaponSel.addEventListener("change", () => { currentId = weaponSel.value; rebuild(); renderOut(); });
bodyColor.addEventListener("change", () => rebuild());

// ---------------------------------------------------------------- loop
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (rig) rig.update(now, dt, false);
  renderer.render(scene, camera);
  diagnose();
  requestAnimationFrame(loop);
}

window.addEventListener("resize", () => {
  camera.aspect = stage.clientWidth / stage.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  updateCross();
});

buildSliders();
rebuild();
renderOut();
updateCross();
requestAnimationFrame(loop);
if (AUTO) setTimeout(() => { postPayload(); autoPost(); }, 1200);

// Aviso en el título para que se sepa que es una página de pruebas.
document.title = "Tuner de aletas — 1ª persona (debug)";
window.__tuner = {
  get: () => payload(),
  set: (id, pose) => { store[id] = pose; save(); if (id === currentId) applyPose(); },
};
</script>
</body>
</html>
